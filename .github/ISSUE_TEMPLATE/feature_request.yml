name: Feature request
description: Propose a new capability or a change to an existing one.
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What a shopper or a store manager cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behaviour you want, and which layer it belongs to (domain rule, use case, screen).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I checked the plan in #2 and the technical debt in .context/docs/tech-debt.md
          required: true
